<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./style.css" />
    <script src="silence-timer.js" defer></script>
  </head>
  <body>
    <div class="section interval-selector">
      <div class="section-label">Na start – smaczek to nagroda za tyle spokoju:</div>
      <div id="min-interval-buttons" class="buttons"></div>
    </div>
    <div class="section interval-selector">
      <div class="section-label">Stopniowo czas będzie rosnąć, aż do:</div>
      <div id="max-interval-buttons" class="buttons"></div>
    </div>
    <div id="start-button" class="section buttons">
      <button id="start" class="start-button">START</button>
    </div>
    <div class="timer-section section">
      <div id="timer">0:00</div>
      <div class="buttons">
        <div class="section-label">Powody żeby zresetować timer:</div>
        <button id="early-snackie" class="main-button">EXTRA SMACZEK!</button>
        <button id="barking-doggo" class="main-button">SZCZEKAJĄCY PIESEK :(</button>
      </div>
    </div>
  </body>
</html>
